version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ope_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ope_dev
      POSTGRES_USER: ope_user
      POSTGRES_PASSWORD: ope_local_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ope_user -d ope_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
