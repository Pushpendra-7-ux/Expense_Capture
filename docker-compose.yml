# docker-compose.yml — Optional local development stack.
#
# With Supabase as the production database, this file is only needed if
# you want to run a local Postgres for offline development.
#
# To use Supabase directly (recommended), just set DATABASE_URL in .env
# and skip `docker compose up`.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ope_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ope_dev
      POSTGRES_USER: ope_user
      POSTGRES_PASSWORD: ope_local_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ope_user -d ope_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
